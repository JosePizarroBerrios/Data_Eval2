version: '3.8'

services:
  database:
    image: ${DOCKER_USER}/innovatech-data:latest
    container_name: data_service
    restart: always
    environment:
      # Definimos la contraseña del superusuario root
      - MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
      - MYSQL_DATABASE=proyecto_db
      #- MYSQL_USER=user1
      - MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }}
    ports:
      - "3306:3306"
    volumes:
      - db_persistence:/var/lib/mysql
    networks:
      - deploy-net

networks:
  deploy-net:
    external: true

volumes:
  db_persistence:
